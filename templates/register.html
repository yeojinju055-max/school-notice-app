{% extends "base.html" %}
{% block title %}회원가입{% endblock %}

{% block content %}
    <form class="auth-form" method="post" action="{{ url_for('register') }}">
        <h1>회원가입</h1>
        <label>
            아이디
            <input type="text" name="username" required>
        </label>
        <label>
            비밀번호
            <input type="password" name="password" required>
        </label>

        <label class="checkbox-row">
            <input type="checkbox" name="is_teacher" id="is_teacher" onchange="document.getElementById('teacher-fields').style.display = this.checked ? 'flex' : 'none'">
            저는 선생님입니다
        </label>

        <div id="teacher-fields" class="teacher-fields" style="display: none;">
            <label>
                담당 과목
                <input type="text" name="subject" placeholder="예: 수학">
            </label>
            <label>
                한 줄 소개
                <input type="text" name="bio" placeholder="예: 함수와 방정식을 담당합니다">
            </label>
        </div>

        <button type="submit">가입하기</button>
        <p class="switch-link">
            이미 계정이 있으신가요? <a href="{{ url_for('login') }}">로그인</a>
        </p>
    </form>
{% endblock %}
